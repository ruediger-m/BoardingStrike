name: CI

# Builds the engine-independent gameplay solution and runs the test suite.
# The Godot presentation project (godot/) is intentionally excluded — it is
# built by the Godot editor/CI export pipeline, not by this workflow, keeping
# the core build engine-free. See docs/technical/architecture.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BoardingStrike.sln

      - name: Build
        run: dotnet build BoardingStrike.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BoardingStrike.sln --configuration Release --no-build --verbosity normal
